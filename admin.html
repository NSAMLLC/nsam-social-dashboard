<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>NSAM Social — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,500..700&display=swap" rel="stylesheet" />
<style>
  /* 2026-11 visual refresh — presentation only. Markup ids, scripts, the
     approval gate and all webhook calls are unchanged. */
  :root{
    --navy:#0f766e; --navy-2:#115e59; --gold:#b45309; --gold-soft:#fef3c7;
    --bg:#fbf7f0; --card:#fff; --ink:#292524; --muted:#78716c; --line:#e7e5e4;
    --ok:#047857; --warn:#b45309; --err:#dc2626;
    --shadow:0 1px 2px rgba(68,48,24,.04),0 12px 32px -16px rgba(68,48,24,.18);
    --display:"Fraunces",Georgia,Cambria,"Times New Roman",serif;
    --sans:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
    background-color:var(--bg);
    background-image:
      radial-gradient(60rem 30rem at 4% -10%,rgba(251,146,60,.17),transparent 60%),
      radial-gradient(50rem 28rem at 100% 0%,rgba(20,184,166,.11),transparent 60%);
    background-attachment:fixed}
  header.bar{color:var(--ink);padding:18px 22px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header.bar .brand{position:relative;padding-left:58px;min-height:46px;display:flex;flex-direction:column;justify-content:center;
    font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em;line-height:1.15;color:#1c1917}
  header.bar .brand::before{content:"\266A";position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;width:46px;height:46px;
    border-radius:16px;background:linear-gradient(135deg,#fb923c,#f43f5e);color:#fff;font-family:var(--sans);font-size:23px;line-height:1;
    box-shadow:0 10px 22px -8px rgba(249,115,22,.55)}
  header.bar .brand small{display:block;font-family:var(--sans);font-weight:600;color:#a8a29e;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
  header.bar button{background:#fff;border:1px solid rgba(28,25,23,.08);color:#44403c;padding:9px 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;margin-left:6px}
  header.bar button:hover{color:var(--navy-2);border-color:#5eead4;transform:translateY(-1px)}
  header.bar button:first-child{background:var(--navy);border-color:var(--navy);color:#fff}
  header.bar button:first-child:hover{background:var(--navy-2);color:#fff}
  .login{position:relative;max-width:400px;margin:90px auto 40px;background:rgba(255,255,255,.95);border:1px solid rgba(28,25,23,.06);border-radius:22px;padding:58px 28px 28px;box-shadow:var(--shadow)}
  .login::before{content:"\266A";position:absolute;left:50%;top:-28px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;width:56px;height:56px;
    border-radius:18px;background:linear-gradient(135deg,#fb923c,#f43f5e);color:#fff;font-size:28px;line-height:1;box-shadow:0 10px 22px -8px rgba(249,115,22,.55)}
  .login h2{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:26px;text-align:center;color:#1c1917}
  .login p{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 20px;text-align:center}
  .login label{display:block;margin-bottom:6px;color:#44403c}
  input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(20,184,166,.16)}
  textarea{min-height:76px;resize:vertical;line-height:1.5}
  button.primary{background:var(--navy);color:#fff;border:none;padding:13px 16px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:14px;transition:.15s;box-shadow:0 10px 20px -10px rgba(15,118,110,.6)}
  button.primary:hover{background:var(--navy-2)}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 22px 12px;background:rgba(251,247,240,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid rgba(28,25,23,.06);position:sticky;top:0;z-index:5}
  .filters select,.filters input{width:auto;min-width:140px;flex:0 0 auto;font-size:13.5px;padding:8px 14px;border-radius:999px;border-color:rgba(28,25,23,.1)}
  .board{display:flex;gap:14px;overflow-x:auto;padding:18px 22px 28px;align-items:flex-start;scrollbar-width:thin;scrollbar-color:#e4d6c1 transparent}
  .col{flex:0 0 290px;background:rgba(255,255,255,.6);border:1px solid rgba(28,25,23,.05);border-radius:18px;padding:12px;min-height:120px}
  .col h3{margin:2px 4px 12px;font-size:13.5px;font-weight:700;color:#292524;display:flex;gap:8px;align-items:center}
  .col h3::before{content:"";width:9px;height:9px;border-radius:50%;background:#a8a29e;flex:none}
  .col h3 .count{margin-left:auto;background:#fff;border:1px solid rgba(28,25,23,.06);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted)}
  /* Column accent dots follow the fixed status order in config.js */
  .col:nth-child(2) h3::before{background:#f59e0b}
  .col:nth-child(3) h3::before{background:#8b5cf6}
  .col:nth-child(4) h3::before{background:#0ea5e9}
  .col:nth-child(5) h3::before{background:#10b981}
  .col:nth-child(6) h3::before{background:#f97316}
  .col:nth-child(7) h3::before{background:#14b8a6}
  .col:nth-child(8) h3::before{background:#0f766e}
  .col:nth-child(9) h3::before{background:#f43f5e}
  .ccard{background:#fff;border:1px solid rgba(28,25,23,.06);border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 2px rgba(68,48,24,.05);transition:.18s}
  .ccard:hover{border-color:#5eead4;transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(68,48,24,.3)}
  .ccard .t{font-weight:700;font-size:14.5px;color:#1c1917;line-height:1.35}
  .ccard .m{font-size:12px;color:var(--muted);margin-top:4px}
  .ccard .tags{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#f5f5f4;color:#57534e}
  .tag.warn{background:#fef3c7;color:#92400e}
  .tag.ok{background:#d1fae5;color:#065f46}
  .tag.err{background:#fee2e2;color:#b91c1c}
  .empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:15px;width:100%}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(41,37,36,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:20}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:22px;max-width:720px;width:100%;box-shadow:0 30px 70px -20px rgba(41,37,36,.5);animation:pop .22s cubic-bezier(.2,.7,.2,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.modal{animation:none}}
  .modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:#fff;border-radius:22px 22px 0 0;z-index:1}
  .modal .mh h2{margin:0;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.25;color:#1c1917}
  .modal .mh .x{cursor:pointer;font-size:22px;color:var(--muted);line-height:1;background:#f5f5f4;border:none;border-radius:50%;width:34px;height:34px;flex:none;transition:.15s}
  .modal .mh .x:hover{background:#e7e5e4;color:#1c1917}
  .modal .mb{padding:20px 22px 24px}
  .fld{margin-bottom:13px}
  .fld .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#a8a29e;font-weight:700;margin-bottom:3px}
  .fld .v{font-size:14.5px;line-height:1.5;word-break:break-word;color:#292524}
  .fld .v a{color:var(--navy);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .sec{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--navy);font-weight:700}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .gate{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:13px 15px;margin-top:10px}
  .gate label{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0;font-weight:500;color:#78350f;cursor:pointer}
  .gate input[type=checkbox]{width:18px;height:18px;flex:none;margin-top:2px;padding:0;accent-color:var(--gold)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .actions button{flex:1 1 46%;padding:12px;border-radius:12px;border:none;font:inherit;font-weight:700;cursor:pointer;font-size:14px;transition:.15s}
  .actions button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(.96)}
  .b-approve{background:#059669;color:#fff} .b-approve:disabled{background:#a7f3d0;color:#fff;cursor:not-allowed}
  .b-rev{background:#d97706;color:#fff} .b-reject{background:#dc2626;color:#fff}
  .b-neutral{background:#f5f5f4;color:#292524}
  .msg{padding:12px 14px;border-radius:12px;font-size:13.5px;margin-top:12px}
  .msg.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <h2>NSAM Social — Admin</h2>
  <p>Enter your admin access token to manage submissions. Approvals are recorded against Michael or Danny.</p>
  <label style="font-size:13px;font-weight:600">Admin access token</label>
  <input type="password" id="token" placeholder="••••••••" autocomplete="current-password">
  <button class="primary" id="loginBtn" onclick="login()">Sign in</button>
  <div id="loginMsg"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bar">
    <div class="brand">NSAM Social Media<small>Approval Dashboard</small></div>
    <div>
      <button onclick="location.href='admin-review.html'">Identity review</button>
      <button onclick="loadBoard()">↻ Refresh</button>
      <button onclick="logout()">Sign out</button>
    </div>
  </header>

  <div class="filters">
    <select id="fStatus" onchange="render()"><option value="">All statuses</option></select>
    <input id="fTeacher" placeholder="Teacher…" oninput="render()">
    <select id="fContent" onchange="render()"><option value="">All content types</option></select>
    <select id="fConsent" onchange="render()"><option value="">All consent</option></select>
    <input id="fMonth" placeholder="Month e.g. 2026-07" oninput="render()">
  </div>

  <div id="board" class="board"></div>
  <div id="boardMsg"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mh"><h2 id="mTitle">Submission</h2><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb" id="mBody"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const C = window.NSAM_CONFIG;
const apiUrl = p => (C.N8N_BASE_URL.replace(/\/$/,'')) + p;
// Admin secret travels only in a request header (n8n Header Auth), never in the body or URL.
const adminHeaders = () => ({'Content-Type':'application/json',[C.ADMIN_AUTH_HEADER||'X-NSAM-Admin-Token']:TOKEN});
let TOKEN = "", DATA = [], CURRENT = null;

// populate filters
C.STATUSES.forEach(s=>addOpt('fStatus',s));
C.CONTENT_TYPES.forEach(s=>addOpt('fContent',s));
["Unknown","Release Form Sent","Complete","Restricted","Opted Out","Not Needed / No Identifiable Student","Adult Student Confirmed","Needs Admin Review"].forEach(s=>addOpt('fConsent',s));
function addOpt(id,v){const o=document.createElement('option');o.value=v;o.textContent=v;document.getElementById(id).appendChild(o)}

// flexible field getter: tolerates "Teacher Name", "Teacher_Name", "teacherName"
function g(o,...keys){
  if(!o) return "";
  for(const k of keys){
    if(o[k]!=null && o[k]!=="") return o[k];
    const sp=k.replace(/_/g,' '); if(o[sp]!=null&&o[sp]!=="") return o[sp];
    const us=k.replace(/ /g,'_'); if(o[us]!=null&&o[us]!=="") return o[us];
  }
  return "";
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function login(){
  const t=document.getElementById('token').value.trim();
  const msg=document.getElementById('loginMsg'); msg.innerHTML='';
  if(!t){msg.className='msg err';msg.textContent='Enter your token.';return;}
  if(C.N8N_BASE_URL.includes('YOUR-N8N-INSTANCE')){msg.className='msg err';msg.textContent='Setup needed: n8n URL not set in config.js.';return;}
  TOKEN=t;
  const ok=await loadBoard(true);
  if(ok){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
  else{TOKEN="";msg.className='msg err';msg.textContent='Could not sign in. Check the token or n8n setup.';}
}
function logout(){TOKEN="";DATA=[];document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('token').value='';}

async function loadBoard(silent){
  const bm=document.getElementById('boardMsg'); if(bm) bm.innerHTML='';
  try{
    const res=await fetch(apiUrl(C.WEBHOOKS.adminList),{method:'POST',headers:adminHeaders(),body:'{}'});
    if(res.status===401||res.status===403) return false;
    if(!res.ok) throw new Error('Server '+res.status);
    const d=await res.json();
    DATA=Array.isArray(d)?d:(d.submissions||[]);
    render();
    return true;
  }catch(err){ if(!silent && bm){bm.className='msg err';bm.textContent='Load failed: '+err.message;} return false; }
}

function render(){
  const fS=document.getElementById('fStatus').value, fT=document.getElementById('fTeacher').value.toLowerCase(),
        fC=document.getElementById('fContent').value, fK=document.getElementById('fConsent').value,
        fM=document.getElementById('fMonth').value;
  const rows=DATA.filter(r=>{
    if(fS && g(r,'Current Status','status')!==fS) return false;
    if(fT && !String(g(r,'Teacher Name','teacherName')).toLowerCase().includes(fT)) return false;
    if(fC && g(r,'Content Type','contentType')!==fC) return false;
    if(fK && g(r,'Consent Status')!==fK) return false;
    if(fM && !String(g(r,'Submission ID','submissionId')).includes(fM)) return false;
    return true;
  });
  const board=document.getElementById('board');
  if(!rows.length){board.innerHTML='<div class="empty">No submissions match. (New ones appear here as teachers submit.)</div>';return;}
  const cols=C.STATUSES;
  board.innerHTML=cols.map(st=>{
    const items=rows.filter(r=>(g(r,'Current Status','status')||'Submitted')===st);
    return `<div class="col"><h3>${st}<span class="count">${items.length}</span></h3>${
      items.map(cardHtml).join('')||'<div style="font-size:12px;color:#90a;opacity:.4;padding:6px">—</div>'}</div>`;
  }).join('');
}

function cardHtml(r){
  const id=g(r,'Submission ID','submissionId');
  const consent=g(r,'Consent Status')||'Unknown';
  const cc=/Complete|Not Needed|Adult/.test(consent)?'ok':(/Opted|Restricted/.test(consent)?'err':'warn');
  return `<div class="ccard" onclick="openModal('${esc(id)}')">
    <div class="t">${esc(g(r,'Submission Title','title')||'(untitled)')}</div>
    <div class="m">${esc(id)} · ${esc(g(r,'Teacher Name','teacherName'))}</div>
    <div class="tags">
      <span class="tag">${esc(g(r,'Content Type','contentType')||'—')}</span>
      <span class="tag ${cc}">${esc(consent)}</span>
    </div></div>`;
}

function openModal(id){
  const r=DATA.find(x=>g(x,'Submission ID','submissionId')===id); if(!r)return; CURRENT=r;
  const consent=g(r,'Consent Status')||'Unknown';
  const consentDone=/Complete|Not Needed|Adult/.test(consent);
  const assets=String(g(r,'Asset Links')||'').split(/[\s,]+/).filter(Boolean);
  const fld=(k,v)=>`<div class="fld"><div class="k">${k}</div><div class="v">${v||'—'}</div></div>`;
  const link=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">open ↗</a>`:'—';
  document.getElementById('mTitle').textContent=g(r,'Submission Title','title')||'Submission';
  document.getElementById('mBody').innerHTML=`
    <div class="grid2">
      ${fld('Submission ID',esc(g(r,'Submission ID','submissionId')))}
      ${fld('Status',esc(g(r,'Current Status','status')))}
      ${fld('Teacher',esc(g(r,'Teacher Name','teacherName')))}
      ${fld('Teacher email',esc(g(r,'Teacher Email','teacherEmail')))}
    </div>
    <div class="sec">Student / family (internal)</div>
    <div class="grid2">
      ${fld('Student first',esc(g(r,'Student First Name','studentFirst')))}
      ${fld('Family (internal)',esc(g(r,'Student Internal Last/Family Name','studentLast')))}
      ${fld('Parent/guardian',esc(g(r,'Parent/Guardian Name','parentName')))}
      ${fld('Parent email',esc(g(r,'Parent/Guardian Email','parentEmail')))}
      ${fld('Public display',esc(g(r,'Public Display Preference','publicDisplay')))}
      ${fld('Instrument',esc(g(r,'Student Instrument','instrument')))}
    </div>
    <div class="sec">Content</div>
    ${fld('Content type',esc(g(r,'Content Type','contentType')))}
    ${fld('Achievement / context',esc(g(r,'Student Achievement / Context Text','achievement')))}
    ${fld('Teacher caption suggestion',esc(g(r,'Teacher Caption Suggestion','captionSuggestion')))}
    ${fld('Asset folder',link(g(r,'Asset Folder Link')))}
    ${fld('Assets ('+assets.length+')', assets.map(link).join(' &nbsp; ')||'—')}
    <div class="sec">Consent</div>
    ${fld('Consent status','<b>'+esc(consent)+'</b>')}
    ${fld('Reported by teacher',esc(g(r,'Consent Situation Reported By Teacher')))}
    ${fld('Signed release form',link(g(r,'Signed Release Form Link')))}
    ${fld('Restrictions / notes',esc(g(r,'Consent Notes / Restrictions')))}
    <div class="actions" style="margin-top:6px">
      <button class="b-neutral" onclick="act('send_release_form')">📧 Send release form</button>
    </div>
    <div class="sec">Caption & tags</div>
    ${fld('AI caption draft',esc(g(r,'AI Caption Draft')))}
    ${fld('AI hashtags draft',esc(g(r,'AI Hashtags Draft')))}
    <div class="fld"><div class="k">Final caption</div>
      <textarea id="finalCaption">${esc(g(r,'Final Caption')||g(r,'AI Caption Draft')||'')}</textarea></div>
    <div class="fld"><div class="k">Final hashtags</div>
      <input id="finalHashtags" value="${esc(g(r,'Final Hashtags')||g(r,'AI Hashtags Draft')||'')}"></div>
    <div class="actions">
      <button class="b-neutral" onclick="act('redraft_caption')">↻ Redraft (AI)</button>
      <button class="b-neutral" onclick="act('save_caption')">💾 Save caption</button>
    </div>
    <div class="sec">Approval</div>
    <div class="grid2">
      <div class="fld"><div class="k">Approving as</div>
        <select id="approver"><option value="">Select approver…</option>${C.APPROVERS.map(a=>`<option>${a}</option>`).join('')}</select></div>
      <div class="fld"><div class="k">Public name usage</div>
        <input id="nameUsage" value="${esc(g(r,'Public Display Preference','publicDisplay'))}"></div>
    </div>
    <div class="gate">
      <label><input type="checkbox" id="gConsent" ${consentDone?'checked':''} onchange="gate()">
        Consent is complete, or there is no identifiable student. ${consentDone?'(auto-confirmed)':''}</label>
      <label><input type="checkbox" id="gCaption" onchange="gate()">
        I have reviewed the final caption.</label>
      <label><input type="checkbox" id="gName" onchange="gate()">
        I have reviewed how the student's name is used publicly.</label>
    </div>
    <div class="actions">
      <button class="b-approve" id="approveBtn" disabled onclick="act('approve')">✅ Approve</button>
      <button class="b-rev" onclick="act('request_revision')">↩ Request revision</button>
    </div>
    <div class="sec">Schedule & post</div>
    <div class="grid2">
      <div class="fld"><div class="k">Platform(s)</div>
        <select id="schPlatform" multiple size="3">${C.PLATFORMS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div class="fld"><div class="k">Date</div><input type="date" id="schDate" value="${esc(g(r,'Scheduled Date'))}">
        <div class="k" style="margin-top:8px">Time</div><input type="time" id="schTime" value="${esc(g(r,'Scheduled Time'))}"></div>
    </div>
    <div class="actions">
      <button class="b-neutral" onclick="act('mark_ready_schedule')">📦 Ready to schedule</button>
      <button class="b-neutral" onclick="act('mark_scheduled')">🗓 Mark scheduled</button>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div class="fld"><div class="k">Posted link — Instagram</div><input id="linkIG" value="${esc(g(r,'Posted Link Instagram'))}"></div>
      <div class="fld"><div class="k">Posted link — Facebook</div><input id="linkFB" value="${esc(g(r,'Posted Link Facebook'))}"></div>
    </div>
    <div class="actions"><button class="b-neutral" onclick="act('mark_posted')">📣 Mark posted + save links</button></div>
    <div class="sec">Admin notes & analytics</div>
    <div class="fld"><div class="k">Admin notes</div><textarea id="adminNotes">${esc(g(r,'Admin Notes'))}</textarea></div>
    <div class="grid2">
      ${['Likes','Comments','Views','Shares','Saves'].map(m=>`<div class="fld"><div class="k">${m}</div><input id="m${m}" value="${esc(g(r,m))}"></div>`).join('')}
    </div>
    <div class="actions">
      <button class="b-neutral" onclick="act('save_notes')">💾 Save notes</button>
      <button class="b-neutral" onclick="act('add_analytics')">💾 Save analytics</button>
      <button class="b-reject" onclick="act('reject')">⛔ Reject</button>
    </div>
    <div id="modalMsg"></div>`;
  gate();
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');CURRENT=null;}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

// Approval gate: all three checks + approver chosen
function gate(){
  const ok=document.getElementById('gConsent')?.checked && document.getElementById('gCaption')?.checked
    && document.getElementById('gName')?.checked && document.getElementById('approver')?.value;
  const b=document.getElementById('approveBtn'); if(b) b.disabled=!ok;
}
document.addEventListener('change',e=>{if(e.target.id==='approver')gate();});

async function act(action){
  if(!CURRENT)return;
  const id=g(CURRENT,'Submission ID','submissionId');
  const msg=document.getElementById('modalMsg'); msg.innerHTML='';
  const val=i=>{const el=document.getElementById(i);if(!el)return undefined;
    if(el.multiple)return [...el.selectedOptions].map(o=>o.value);return el.value;};
  const payload={
    parentEmail:g(CURRENT,'Parent/Guardian Email','parentEmail'),
    studentFirst:g(CURRENT,'Student First Name','studentFirst'),
    finalCaption:val('finalCaption'), finalHashtags:val('finalHashtags'),
    approver:val('approver'), nameUsage:val('nameUsage'),
    consentVerified:document.getElementById('gConsent')?.checked,
    captionReviewed:document.getElementById('gCaption')?.checked,
    nameReviewed:document.getElementById('gName')?.checked,
    platforms:val('schPlatform'), scheduledDate:val('schDate'), scheduledTime:val('schTime'),
    postedLinkInstagram:val('linkIG'), postedLinkFacebook:val('linkFB'),
    adminNotes:val('adminNotes'),
    analytics:{Likes:val('mLikes'),Comments:val('mComments'),Views:val('mViews'),Shares:val('mShares'),Saves:val('mSaves')}
  };
  if(action==='approve' && !payload.approver){msg.className='msg err';msg.textContent='Choose Michael or Danny as approver.';return;}
  msg.innerHTML='<div class="msg"><span class="spin"></span>Working…</div>';
  try{
    const res=await fetch(apiUrl(C.WEBHOOKS.adminAction),{method:'POST',headers:adminHeaders(),
      body:JSON.stringify({action,submissionId:id,payload})});
    if(!res.ok) throw new Error('Server '+res.status);
    let d={};try{d=await res.json()}catch(_){}
    msg.className='msg ok'; msg.textContent=(d.message||'Done.')+' Refreshing…';
    await loadBoard(true);
    const updated=DATA.find(x=>g(x,'Submission ID','submissionId')===id);
    if(updated){CURRENT=updated; setTimeout(()=>openModal(id),400);} else closeModal();
  }catch(err){ msg.className='msg err'; msg.textContent='Action failed: '+err.message; }
}
</script>
